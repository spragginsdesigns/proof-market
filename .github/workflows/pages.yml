# Publish the web app (dist/) to GitHub Pages. Manual only: nothing is published
# until a person runs it from the Actions tab or with `gh workflow run pages.yml`.
# The build makes no network calls. The published page reads pmarket.testnet from
# the visitor's browser over public JSON-RPC, and falls back to the bundled
# snapshot (web/public/data/snapshot.json) if no RPC answers.
name: Publish app to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build the static app against the live testnet contract
        run: npm run build
        env:
          VITE_CONTRACT: pmarket.testnet
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload dist/
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
